<div class="weather-card">
    <div [ngSwitch]="weather?.current?.is_day">
        <h1 *ngSwitchCase="1" class="weather-card__header--day">Es de día</h1>
        <h1 *ngSwitchDefault class="weather-card__header--night">Es de noche</h1>
      </div>
    


    <img [src]="weather?.current?.condition?.icon">
    <h1 class="weather-card__temp">{{weather?.current?.temp_c}} °C</h1>
    <p>{{ 'WEATHER.' + (weather?.current?.condition?.text || '') | translate }}</p>

    <p>{{weather?.current?.last_updated}}</p>
</div>
